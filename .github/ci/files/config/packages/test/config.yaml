imports:
    - { resource: ../../config.yaml }

opendxp:
    documents:
        default_controller: 'OpenDxp\Tests\Support\Controller\DefaultController::defaultAction'

services:
    OpenDxp\Tests\Support\Controller\DefaultController:
        autowire: true
        autoconfigure: true
        tags:
            - 'controller.service_arguments'

fos_http_cache:
    proxy_client:
        noop: ~
    tags:
        enabled: true
