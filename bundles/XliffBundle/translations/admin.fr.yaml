xliff_export_documents: 'Si vous voulez traduire par exemple l''ensemble de l''arborescence /en vers une autre langue, veuillez d''abord créer une copie de /en, par exemple /de, puis l''exporter pour le traduire. Lors de l''importation XLIFF le contenu anglais dans /de sera remplacé par la traduction allemande dans le fichier XLIFF.'
xliff_export_notice: 'Vous pouvez sélectionner ici les documents et objets que vous souhaitez exporter pour traduction.'
xliff_export_objects: 'Seuls les champs à l''intérieur d''un conteneur Champs Localisés sont reconnus. Lors de l''importation des traductions XLIFF la langue source restera intacte, seuls les champs de la langue cible seront écrasées.'
xliff_import_export: 'Xliff Import/Export'
xliff_import_notice: 'Sélectionnez un fichier XLIFF traduit qui a été précédemment exporté par OpenDXP puis traduit par un fournisseur de services de traduction (LSP) ou par une application de type CAT. Soyez conscient que l''importation va écraser les éléments qui ont été sélectionnés par l''importation (idem pour l''exportation).'
