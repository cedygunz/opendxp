xliff_export_documents: 'หากคุณต้องการแปลเช่น. ทั้งทรี / en เป็นภาษาอื่นก่อนอื่นให้สร้างสำเนาของทรี / en หลังจากนั้นใช้แผนผังที่คัดลอกในการส่งออกและเลือกภาษาต้นทาง "en" และภาษาเป้าหมาย "de" เมื่อนำเข้าไฟล์ XLIFF ที่แปลแล้วเนื้อหาของเอกสารที่ส่งออก (ในกรณีนี้คือเอกสารแผนผังที่คัดลอก) จะถูกเขียนทับโดยการแปลภาษาเยอรมันในไฟล์ XLIFF'
xliff_export_notice: 'คุณสามารถเลือกเอกสารและวัตถุที่คุณต้องการส่งออกสำหรับการแปลภายนอกได้ที่นี่'
xliff_export_objects: 'รู้จักเฉพาะฟิลด์ภายในคอนเทนเนอร์ Localized Fields เท่านั้น เมื่อนำเข้า XLIFF ที่แปลแล้วภาษาต้นทางจะไม่ถูกแตะต้องเฉพาะฟิลด์ภาษาเป้าหมายเท่านั้นที่จะถูกเขียนทับ ใช้ช่องทำเครื่องหมายความสัมพันธ์เพื่อรวมวัตถุและเอกสารจากการอ้างอิงเช่น สาขาที่เกี่ยวข้องคุณสมบัติ ฯลฯ'
xliff_import_export: 'Xliff Import/Export'
xliff_import_notice: 'เลือกไฟล์ XLIFF ที่แปลแล้วซึ่งก่อนหน้านี้ส่งออกโดย opendxp แล้วแปลโดยผู้ให้บริการโลคัลไลเซชัน (LSP) หรือโดยแอปพลิเคชัน CAT โปรดทราบว่าการนำเข้าจะเขียนทับองค์ประกอบที่ถูกเลือกโดยการนำเข้า (อ่านเพิ่มเติมที่การส่งออก)'
